[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glisteel-editor"
dynamic = ["version"]
description = "The GLinting Steel track editor: draw a circuit on a landscape and bake a world to drive"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = ["editor", "racing", "OpenGLContext", "OpenGL", "3D Tiles", "terrain", "3D"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Games/Entertainment :: Simulation",
]

# The engine draws the map and runs the interface; the authoring package
# generates the road and bakes the world. The *game* is not a dependency: an
# editor that cannot find one still edits, and says so when asked to drive.
dependencies = [
    "OpenGLContext[glfw]>=3.0.0a3",
    "OpenGLContext-editor",
    # The game, required rather than offered as an extra: driving what has just
    # been baked is what an editor is for, and `pip install glisteel-editor`
    # should give something that can. The arrow runs this way and only this way
    # -- the game does not depend back on the editor -- which is the same shape
    # as openglcontext-marble-editor and openglcontext-marble-demo.
    "glisteel",
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-timeout", "ruff", "mypy"]

[project.urls]
Repository = "https://github.com/mcfletch/glisteel-editor"

[project.scripts]
glisteel-editor = "glisteel_editor.app:main"
# Bake the shipped circuit world from a shell, the way File -> Bake a world
# does from the menu.
glisteel-bake = "glisteel_editor.bake:main"

[tool.setuptools.dynamic]
version = { attr = "glisteel_editor.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["glisteel_editor*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # import ordering
    "UP",   # pyupgrade
    "BLE",  # no blind except
    "S110", # no silent try/except/pass
]
ignore = [
    "E501",   # line too long -- kept readable by hand, as in the engine
    "E741",   # ambiguous name -- x/y/z read naturally as coordinates
    "UP031",  # percent formatting, as the engine uses throughout
]

[tool.ruff.lint.per-file-ignores]
# The entry module sets the OPENGLCONTEXT_* environment the engine reads at
# import time, so its imports deliberately are not all at the top.
"glisteel_editor/app.py" = ["E402"]

[tool.mypy]
# 3.12 rather than the 3.10 floor in ``requires-python``: numpy's own stubs use
# 3.12 type syntax, so checking against 3.10 fails before it reaches any code
# here. What the floor promises is checked by the test suite, which runs on it.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true

# The engine and the physics ship no ``py.typed``, so mypy has nothing to check
# their surface against. Saying so per package keeps the silence deliberate and
# narrow: anything *else* that cannot be resolved is still an error worth
# seeing, which a bare global ignore would hide.
[[tool.mypy.overrides]]
module = ["OpenGLContext.*", "OpenGLContext_editor.*", "omi_physics.*", "OpenGL.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
# The package as well as the tests, so a worked example in a docstring is one
# that is run: an example nobody runs drifts away from the code it describes
# without anything saying so.
testpaths = ["tests", "glisteel_editor"]
addopts = "-ra --doctest-modules"
timeout = 300
# Baking a world is seconds of work rather than milliseconds, and the tests that
# do it are most of what the suite costs. They are marked rather than removed --
# a bake is the one thing the editor is for -- so a working loop can be
# `-m "not slow"` and a full run is still the default.
markers = [
    "slow: bakes a world; seconds rather than milliseconds",
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in glisteel_editor/__init__.py, so name that file too: without it a
# version bump leaves uv answering with the previous number, and a dependent
# requiring the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "glisteel_editor/__init__.py" }]
