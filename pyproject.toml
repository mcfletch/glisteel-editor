[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "glisteel-editor"
dynamic = ["version"]
description = "The GLinting Steel track editor: draw a circuit on a landscape and bake a world to drive"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["license.txt"]
requires-python = ">=3.10"
authors = [
    { name = "Mike C. Fletcher", email = "mcfletch@vrplumber.com" }
]
keywords = ["editor", "racing", "OpenGLContext", "OpenGL", "3D Tiles", "terrain", "3D"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: X11 Applications",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics :: 3D Modeling",
    "Topic :: Games/Entertainment :: Simulation",
]

# The engine draws the map and runs the interface; the authoring package
# generates the road and bakes the world. The *game* is not a dependency: an
# editor that cannot find one still edits, and says so when asked to drive.
dependencies = [
    "OpenGLContext[glfw]>=3.0.0a5",
    "OpenGLContext-editor",
    # The game, required rather than offered as an extra: driving what has just
    # been baked is what an editor is for, and `pip install glisteel-editor`
    # should give something that can. The arrow runs this way and only this way
    # -- the game does not depend back on the editor -- which is the same shape
    # as openglcontext-marble-editor and openglcontext-marble-demo.
    "glisteel",
    "numpy>=2.0",
    # Reading a track recipe. tomllib is the standard library's from 3.11, and
    # this is the same reader under its earlier name for the versions below it.
    "tomli>=1.1.0 ; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "pytest-timeout", "ruff", "mypy"]

[project.urls]
Repository = "https://github.com/mcfletch/glisteel-editor"

[project.scripts]
glisteel-editor = "glisteel_editor.app:main"
# Bake the shipped circuit world from a shell, the way File -> Bake a world
# does from the menu.
glisteel-bake = "glisteel_editor.bake:main"

[tool.setuptools.dynamic]
version = { attr = "glisteel_editor.__version__" }

[tool.setuptools.packages.find]
where = ["."]
include = ["glisteel_editor*"]

[tool.openglcontext-checks]
# The OGC rules (openglcontext-checks) this project is clean of, held by
# the workspace preflight. The others join as the project reaches zero of
# each; the counts are in openglcontext/plans/DEFECT-PREVENTION.md.
select = ["OGC101", "OGC102", "OGC111", "OGC121", "OGC131", "OGC141", "OGC221", "OGC222", "OGC223"]

[tool.openglcontext-checks.scopes]
# The project file reader, which OGC101, OGC102 and OGC111 hold to checked
# values, sizes and paths.
loader = ["glisteel_editor/project.py"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "B",    # flake8-bugbear
    "I",    # import ordering
    "UP",   # pyupgrade
    "BLE",  # no blind except
    "S110", # no silent try/except/pass
    "PGH003", "PGH004",  # a type: ignore or noqa names the codes it silences
    "PLE0604", "PLE0605",  # __all__ is a list or tuple of strings
    "S112",   # no silent try/except/continue
    "TRY400", # an error logged from an except keeps its traceback
    "RUF012",  # a mutable class attribute is declared ClassVar
    "RUF100",  # no noqa for a code that is not reported there
    "PLC0415", # imports at the top of the module
    "ARG",     # no unused argument, except one a protocol fixes
    "SLF001",  # no reaching into another object's private names
    "DTZ",     # no naive datetimes
    "S102", "S202", "S301", "S307", "S310",  # no exec, eval, pickle, unchecked tar or URL scheme
    "TID251",  # the raw forms the engine has an API for (banned-api, below)
]
ignore = [
    "E501",   # line too long -- kept readable by hand, as in the engine
    "E741",   # ambiguous name -- x/y/z read naturally as coordinates
    "UP031",  # percent formatting, as the engine uses throughout
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
# The workspace's banned-api list (openglcontext/plans/DEFECT-PREVENTION.md):
# the raw form, and the engine API that replaces it. The modules that
# implement a replacement, and the programs and tests that set the process
# environment, are exempted in per-file-ignores.
"urllib.request.urlopen".msg = "fetch through OpenGLContext.loaders.resolver: Resolver.fetch, fetch_url, or AllowedHosts.open_url for a service's own hosts"
"urllib.request.urlretrieve".msg = "fetch through OpenGLContext.loaders.resolver: fetch_to_cache, or AllowedHosts.open_url for a service's own hosts"
"tarfile.TarFile.extractall".msg = "unpack through OpenGLContext.contentpacks.archive.extract, which refuses a member that leaves the directory and caps the size"
"zipfile.ZipFile.extractall".msg = "unpack through OpenGLContext.contentpacks.archive.extract, which refuses a member that leaves the directory and caps the size"
"shutil.rmtree".msg = "replace or remove a directory through OpenGLContext.atomicfiles: staged_directory, replace_directory or remove_directory"
"shutil.move".msg = "move a finished file or directory into place through OpenGLContext.atomicfiles: staged_file, staged_directory or replace_directory"
"os.rename".msg = "os.rename refuses an existing target on Windows; use os.replace, or OpenGLContext.atomicfiles"
"os.environ".msg = "read a switch once, through OpenGLContext.renderoptions.env_flag_once / env_number_once, or in the program's start-up"
"os.getenv".msg = "read a switch once, through OpenGLContext.renderoptions.env_flag_once / env_number_once, or in the program's start-up"
"os._exit".msg = "exit through OpenGLContext.testing.process_exit.flush_and_exit, which flushes what was written first"

[tool.ruff.lint.per-file-ignores]
# The entry module sets the OPENGLCONTEXT_* environment the engine reads at
# import time, and a test sets the environment of the process it starts.
"glisteel_editor/app.py" = ["TID251"]
"tests/*" = ["TID251"]

[tool.mypy]
# 3.12 rather than the 3.10 floor in ``requires-python``: numpy's own stubs use
# 3.12 type syntax, so checking against 3.10 fails before it reaches any code
# here. What the floor promises is checked by the test suite, which runs on it.
python_version = "3.12"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true
disallow_untyped_defs = true

# The engine and the physics ship no ``py.typed``, so mypy has nothing to check
# their surface against. Saying so per package keeps the silence deliberate and
# narrow: anything *else* that cannot be resolved is still an error worth
# seeing, which a bare global ignore would hide.
[[tool.mypy.overrides]]
module = ["OpenGLContext.*", "OpenGLContext_editor.*", "omi_physics.*", "OpenGL.*"]
ignore_missing_imports = true
follow_untyped_imports = false

[tool.pytest.ini_options]
# The package as well as the tests, so a worked example in a docstring is one
# that is run: an example nobody runs drifts away from the code it describes
# without anything saying so.
testpaths = ["tests", "glisteel_editor"]
addopts = "-ra --doctest-modules"
timeout = 300
# Baking a world is seconds of work rather than milliseconds, and the tests that
# do it are most of what the suite costs. They are marked rather than removed --
# a bake is the one thing the editor is for -- so a working loop can be
# `-m "not slow"` and a full run is still the default.
markers = [
    "slow: bakes a world; seconds rather than milliseconds",
]

# uv decides whether its cached metadata for a source tree is still current
# from pyproject.toml, setup.py and setup.cfg alone. This project's version
# lives in glisteel_editor/__init__.py, so name that file too: without it a
# version bump leaves uv answering with the previous number, and a dependent
# requiring the new one resolves against PyPI rather than this checkout.
[tool.uv]
cache-keys = [{ file = "pyproject.toml" }, { file = "glisteel_editor/__init__.py" }]
